

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Scoreboard</title>
    <link rel="stylesheet" href="style7.css">
</head>
<body>
    <header class="page-header">
        <div class="page-header__title">
            <h1>Scoreboard Dashboard</h1>
            <p>Live scoring for Home and Away teams</p>
        </div>
        <div class="page-header__meta">
            <span>Game Tracker</span>
            <span>v1.0</span>
        </div>
    </header>
    <div class="Scoreboard">

        <div class="one">

            <h1>HOME</h1>
            <h2 id="count-el"> 0 </h2>

            <button id="add-one" onclick="addOne()">1</button>
            <button id="add-two" onclick="addTwo()">2</button>
            <button id="add-three" onclick="addThree()">3</button>

        </div>
    </div>

    <div class="middle">
        
        <div class="middle-btn">

            <h2>PERIOD</h2>
            <h4 id="countP-el"> 0 </h4>

            <h2>FOULS</h2>
            <h6 id="countF-el"> 0 </h6>

            <h2>TIMER</h2>
            <h8 id="countT-el"> 0 </h8>

            <h2>CURRENT WINNER</h2>

            <p id="countW-el">0</p>

        </div>
    </div>


        <div class="two">
            <div class="second">

            <h1>AWAY</h1>
            <h2 id="countTwo-el"> 0 </h2>

            <button id="adds-one" onclick="addsOne()">1</button>
            <button id="adds-two" onclick="addsTwo()">2</button>
            <button id="adds-three" onclick="addsThree()">3</button>
            </div>
        </div>
        

    <div class="new">
        <button id="new-game" onclick="newGame()">New Game</button>
        <button id="end-game" onclick="endGame()">End Game</button>
    </div>






<script src="index7.js"></script>
</body>
</html>
